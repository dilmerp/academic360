<div class="max-w-7xl mx-auto pb-10">
  <div class="mb-6">
    <h2 class="text-2xl font-bold text-slate-800">Nueva Matrícula - Cursos Libres</h2>
    <p class="text-slate-500 text-sm mt-1">Registre un alumno en un programa con su asignación de cursos y cronograma de pagos.</p>
  </div>

  <!-- Alertas -->
  <div *ngIf="mensajeError" class="mb-6 bg-rose-50 border border-rose-200 text-rose-700 px-4 py-3 rounded-xl shadow-sm">
    <span class="block sm:inline font-medium">{{ mensajeError }}</span>
  </div>
  <div *ngIf="mensajeExito" class="mb-6 bg-emerald-50 border border-emerald-200 text-emerald-800 px-4 py-3 rounded-xl shadow-sm">
    <span class="block sm:inline font-medium">{{ mensajeExito }}</span>
  </div>

  <form [formGroup]="matriculaForm" (ngSubmit)="guardarMatricula()" class="space-y-6">

    <!-- TARJETA 1: DATOS GENERALES -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden p-6">
      <h3 class="text-lg font-bold text-slate-700 mb-4 border-b border-slate-100 pb-2">1. Información de Cabecera</h3>
      <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1.5">ID Alumno *</label>
          <input type="number" formControlName="idAlumno" class="w-full bg-slate-50 border border-slate-300 rounded-lg text-slate-800 px-4 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1.5">Producto *</label>
          <select formControlName="idProducto" class="w-full bg-slate-50 border border-slate-300 rounded-lg text-slate-800 px-4 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            <option [ngValue]="null">Seleccione...</option>
            <option [value]="1">Curso Libre</option>
            <option [value]="2">Diplomado</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1.5">Promoción *</label>
          <input type="number" formControlName="idPromocion" class="w-full bg-slate-50 border border-slate-300 rounded-lg text-slate-800 px-4 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1.5">Grupo *</label>
          <input type="number" formControlName="idGrupo" class="w-full bg-slate-50 border border-slate-300 rounded-lg text-slate-800 px-4 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1.5">Medio de Com. *</label>
          <input type="number" formControlName="idMedio" class="w-full bg-slate-50 border border-slate-300 rounded-lg text-slate-800 px-4 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1.5">Plan de Pago *</label>
          <input type="number" formControlName="idPlan" class="w-full bg-slate-50 border border-slate-300 rounded-lg text-slate-800 px-4 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1.5">Moneda *</label>
          <select formControlName="idMoneda" class="w-full bg-slate-50 border border-slate-300 rounded-lg text-slate-800 px-4 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            <option [ngValue]="null">Seleccione...</option>
            <option [value]="1">Soles (PEN)</option>
            <option [value]="2">Dólares (USD)</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1.5">Beca (Opcional)</label>
          <input type="number" formControlName="idBeca" class="w-full bg-slate-50 border border-slate-300 rounded-lg text-slate-800 px-4 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
      </div>
    </div>

    <!-- TARJETA 2: CURSOS Y SECCIONES -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden p-6">
      <div class="flex justify-between items-center mb-4 border-b border-slate-100 pb-2">
        <h3 class="text-lg font-bold text-slate-700">2. Asignación de Cursos</h3>
        <button type="button" (click)="agregarCurso()" class="bg-indigo-50 text-indigo-700 hover:bg-indigo-100 px-4 py-1.5 rounded-lg text-sm font-semibold transition-colors flex items-center">
          <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
          Agregar Curso
        </button>
      </div>

      <div formArrayName="cursos" class="space-y-3">
        <div *ngFor="let curso of cursos.controls; let i=index" [formGroupName]="i" class="flex gap-4 items-end bg-slate-50 p-4 rounded-lg border border-slate-200">
          <div class="flex-1">
            <label class="block text-xs font-semibold text-slate-500 mb-1">Módulo</label>
            <input type="number" formControlName="idModulo" class="w-full bg-white border border-slate-300 rounded-lg text-slate-800 px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div class="flex-1">
            <label class="block text-xs font-semibold text-slate-500 mb-1">Curso</label>
            <input type="number" formControlName="idCurso" class="w-full bg-white border border-slate-300 rounded-lg text-slate-800 px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div class="flex-1">
            <label class="block text-xs font-semibold text-slate-500 mb-1">Sección</label>
            <input type="number" formControlName="idSeccion" class="w-full bg-white border border-slate-300 rounded-lg text-slate-800 px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <button type="button" (click)="removerCurso(i)" class="mb-1 p-2 text-rose-500 hover:bg-rose-100 rounded-lg transition-colors" title="Eliminar Fila">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- TARJETA 3: CRONOGRAMA DE PAGOS -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden p-6">
      <div class="flex justify-between items-center mb-4 border-b border-slate-100 pb-2">
        <h3 class="text-lg font-bold text-slate-700">3. Cronograma de Pagos (Cuotas)</h3>
        <button type="button" (click)="agregarCuota()" class="bg-indigo-50 text-indigo-700 hover:bg-indigo-100 px-4 py-1.5 rounded-lg text-sm font-semibold transition-colors flex items-center">
          <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
          Añadir Cuota
        </button>
      </div>

      <div formArrayName="cuotas" class="space-y-3">
        <div *ngFor="let cuota of cuotas.controls; let i=index" [formGroupName]="i" class="grid grid-cols-8 gap-3 items-end bg-slate-50 p-4 rounded-lg border border-slate-200">
          <div class="col-span-1">
            <label class="block text-xs font-semibold text-slate-500 mb-1">Concepto</label>
            <input type="number" formControlName="idConcepto" class="w-full bg-white border border-slate-300 rounded-lg text-slate-800 px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div class="col-span-2">
            <label class="block text-xs font-semibold text-slate-500 mb-1">Descripción</label>
            <input type="text" formControlName="precioDescripcion" class="w-full bg-white border border-slate-300 rounded-lg text-slate-800 px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Ej. Cuota 1">
          </div>
          <div class="col-span-1">
            <label class="block text-xs font-semibold text-slate-500 mb-1">N° Cuota</label>
            <input type="number" formControlName="cuota" class="w-full bg-white border border-slate-300 rounded-lg text-slate-800 px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div class="col-span-1">
            <label class="block text-xs font-semibold text-slate-500 mb-1">Subtotal</label>
            <input type="number" step="0.01" formControlName="totalCuotas" class="w-full bg-white border border-slate-300 rounded-lg text-slate-800 px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div class="col-span-1">
            <label class="block text-xs font-semibold text-slate-500 mb-1">Monto Final</label>
            <input type="number" step="0.01" formControlName="precio" class="w-full bg-white border border-slate-300 rounded-lg text-slate-800 px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div class="col-span-1">
            <label class="block text-xs font-semibold text-slate-500 mb-1">Vencimiento</label>
            <input type="date" formControlName="vencimiento" class="w-full bg-white border border-slate-300 rounded-lg text-slate-800 px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div class="col-span-1 flex justify-end">
            <button type="button" (click)="removerCuota(i)" class="mb-1 p-2 text-rose-500 hover:bg-rose-100 rounded-lg transition-colors" title="Eliminar Cuota">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- BOTONERA DE ACCIÓN -->
    <div class="flex justify-end gap-3 pt-2">
      <button type="button" routerLink="/matriculas-libres" class="px-6 py-2.5 bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 rounded-lg font-semibold shadow-sm transition-colors">
        Cancelar
      </button>
      <button type="submit" [disabled]="isSubmitting" class="px-8 py-2.5 bg-indigo-600 text-white hover:bg-indigo-700 rounded-lg font-semibold shadow-sm transition-colors flex items-center disabled:opacity-70 disabled:cursor-not-allowed">
        <svg *ngIf="isSubmitting" class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        Registrar Matrícula Completa
      </button>
    </div>
  </form>
</div>
