<div class="max-w-7xl mx-auto pb-8">
  <div class="mb-4">
    <h2 class="text-xl font-bold text-slate-800">Nueva Matrícula - Cursos Libres</h2>
    <p class="text-slate-500 text-xs mt-0.5">Registre un alumno en un programa con su asignación de cursos y cronograma de pagos.</p>
  </div>

  <!-- Alertas -->
  <div *ngIf="mensajeError" class="mb-4 bg-rose-50 border border-rose-200 text-rose-700 px-3 py-2 rounded-md shadow-sm flex items-center text-[13px]">
    <svg class="w-4 h-4 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
    <span class="block sm:inline font-medium">{{ mensajeError }}</span>
  </div>
  <div *ngIf="mensajeExito" class="mb-4 bg-emerald-50 border border-emerald-200 text-emerald-800 px-3 py-2 rounded-md shadow-sm flex items-center text-[13px]">
    <svg class="w-4 h-4 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
    <span class="block sm:inline font-medium">{{ mensajeExito }}</span>
  </div>

  <form [formGroup]="matriculaForm" (ngSubmit)="guardarMatricula()" class="space-y-4">

    <!-- TARJETA 1: DATOS GENERALES -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden p-4 sm:p-5">
      <h3 class="text-[15px] font-bold text-slate-700 mb-3 border-b border-slate-100 pb-2">1. Información de Cabecera</h3>
      <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">ID Alumno *</label>
          <input type="number" formControlName="idAlumno" class="w-full bg-slate-50 border border-slate-300 rounded-md text-slate-800 px-3 py-1.5 text-[13px] focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-colors">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Producto *</label>
          <select formControlName="idProducto" class="w-full bg-slate-50 border border-slate-300 rounded-md text-slate-800 px-3 py-1.5 text-[13px] focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-colors">
            <option [ngValue]="null">Seleccione...</option>
            <option [value]="1">Curso Libre</option>
            <option [value]="2">Diplomado</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Promoción *</label>
          <input type="number" formControlName="idPromocion" class="w-full bg-slate-50 border border-slate-300 rounded-md text-slate-800 px-3 py-1.5 text-[13px] focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-colors">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Grupo *</label>
          <input type="number" formControlName="idGrupo" class="w-full bg-slate-50 border border-slate-300 rounded-md text-slate-800 px-3 py-1.5 text-[13px] focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-colors">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Medio de Com. *</label>
          <input type="number" formControlName="idMedio" class="w-full bg-slate-50 border border-slate-300 rounded-md text-slate-800 px-3 py-1.5 text-[13px] focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-colors">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Plan de Pago *</label>
          <input type="number" formControlName="idPlan" class="w-full bg-slate-50 border border-slate-300 rounded-md text-slate-800 px-3 py-1.5 text-[13px] focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-colors">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Moneda *</label>
          <select formControlName="idMoneda" class="w-full bg-slate-50 border border-slate-300 rounded-md text-slate-800 px-3 py-1.5 text-[13px] focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-colors">
            <option [ngValue]="null">Seleccione...</option>
            <option [value]="1">Soles (PEN)</option>
            <option [value]="2">Dólares (USD)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Beca (Opcional)</label>
          <input type="number" formControlName="idBeca" class="w-full bg-slate-50 border border-slate-300 rounded-md text-slate-800 px-3 py-1.5 text-[13px] focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-colors">
        </div>
      </div>
    </div>

    <!-- TARJETA 2: CURSOS Y SECCIONES -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden p-4 sm:p-5">
      <div class="flex justify-between items-center mb-3 border-b border-slate-100 pb-2">
        <h3 class="text-[15px] font-bold text-slate-700">2. Asignación de Cursos</h3>
        <button type="button" (click)="agregarCurso()" class="bg-indigo-50 text-indigo-700 hover:bg-indigo-100 px-3 py-1.5 rounded-md text-[13px] font-semibold transition-colors flex items-center shadow-sm">
          <svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
          Agregar Curso
        </button>
      </div>

      <div formArrayName="cursos" class="space-y-2">
        <div *ngFor="let curso of cursos.controls; let i=index" [formGroupName]="i" class="flex gap-3 items-end bg-slate-50 p-3 rounded-md border border-slate-200">
          <div class="flex-1">
            <label class="block text-[11px] font-semibold text-slate-500 mb-1 uppercase tracking-wider">Módulo</label>
            <input type="number" formControlName="idModulo" class="w-full bg-white border border-slate-300 rounded-md text-slate-800 px-3 py-1.5 text-[13px] focus:ring-2 focus:ring-indigo-500 outline-none transition-colors">
          </div>
          <div class="flex-1">
            <label class="block text-[11px] font-semibold text-slate-500 mb-1 uppercase tracking-wider">Curso</label>
            <input type="number" formControlName="idCurso" class="w-full bg-white border border-slate-300 rounded-md text-slate-800 px-3 py-1.5 text-[13px] focus:ring-2 focus:ring-indigo-500 outline-none transition-colors">
          </div>
          <div class="flex-1">
            <label class="block text-[11px] font-semibold text-slate-500 mb-1 uppercase tracking-wider">Sección</label>
            <input type="number" formControlName="idSeccion" class="w-full bg-white border border-slate-300 rounded-md text-slate-800 px-3 py-1.5 text-[13px] focus:ring-2 focus:ring-indigo-500 outline-none transition-colors">
          </div>
          <button type="button" (click)="removerCurso(i)" class="mb-0.5 p-1.5 text-rose-500 hover:bg-rose-100 rounded-md transition-colors" title="Eliminar Fila">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- TARJETA 3: CRONOGRAMA DE PAGOS -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden p-4 sm:p-5">
      <div class="flex justify-between items-center mb-3 border-b border-slate-100 pb-2">
        <h3 class="text-[15px] font-bold text-slate-700">3. Cronograma de Pagos (Cuotas)</h3>
        <button type="button" (click)="agregarCuota()" class="bg-indigo-50 text-indigo-700 hover:bg-indigo-100 px-3 py-1.5 rounded-md text-[13px] font-semibold transition-colors flex items-center shadow-sm">
          <svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
          Añadir Cuota
        </button>
      </div>

      <div formArrayName="cuotas" class="space-y-2">
        <div *ngFor="let cuota of cuotas.controls; let i=index" [formGroupName]="i" class="grid grid-cols-8 gap-2 items-end bg-slate-50 p-3 rounded-md border border-slate-200">
          <div class="col-span-1">
            <label class="block text-[11px] font-semibold text-slate-500 mb-1 uppercase tracking-wider">Concepto</label>
            <input type="number" formControlName="idConcepto" class="w-full bg-white border border-slate-300 rounded-md text-slate-800 px-2.5 py-1.5 text-[13px] focus:ring-2 focus:ring-indigo-500 outline-none transition-colors">
          </div>
          <div class="col-span-2">
            <label class="block text-[11px] font-semibold text-slate-500 mb-1 uppercase tracking-wider">Descripción</label>
            <input type="text" formControlName="precioDescripcion" class="w-full bg-white border border-slate-300 rounded-md text-slate-800 px-2.5 py-1.5 text-[13px] focus:ring-2 focus:ring-indigo-500 outline-none transition-colors" placeholder="Ej. Cuota 1">
          </div>
          <div class="col-span-1">
            <label class="block text-[11px] font-semibold text-slate-500 mb-1 uppercase tracking-wider">N° Cuota</label>
            <input type="number" formControlName="cuota" class="w-full bg-white border border-slate-300 rounded-md text-slate-800 px-2.5 py-1.5 text-[13px] focus:ring-2 focus:ring-indigo-500 outline-none transition-colors">
          </div>
          <div class="col-span-1">
            <label class="block text-[11px] font-semibold text-slate-500 mb-1 uppercase tracking-wider">Subtotal</label>
            <input type="number" step="0.01" formControlName="totalCuotas" class="w-full bg-white border border-slate-300 rounded-md text-slate-800 px-2.5 py-1.5 text-[13px] focus:ring-2 focus:ring-indigo-500 outline-none transition-colors">
          </div>
          <div class="col-span-1">
            <label class="block text-[11px] font-semibold text-slate-500 mb-1 uppercase tracking-wider">Monto Final</label>
            <input type="number" step="0.01" formControlName="precio" class="w-full bg-white border border-slate-300 rounded-md text-slate-800 px-2.5 py-1.5 text-[13px] focus:ring-2 focus:ring-indigo-500 outline-none transition-colors">
          </div>
          <div class="col-span-1">
            <label class="block text-[11px] font-semibold text-slate-500 mb-1 uppercase tracking-wider">Vencimiento</label>
            <input type="date" formControlName="vencimiento" class="w-full bg-white border border-slate-300 rounded-md text-slate-800 px-2.5 py-1.5 text-[13px] focus:ring-2 focus:ring-indigo-500 outline-none transition-colors">
          </div>
          <div class="col-span-1 flex justify-end">
            <button type="button" (click)="removerCuota(i)" class="mb-0.5 p-1.5 text-rose-500 hover:bg-rose-100 rounded-md transition-colors" title="Eliminar Cuota">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- BOTONERA DE ACCIÓN -->
    <div class="flex justify-end gap-2.5 pt-2">
      <button type="button" routerLink="/matriculas-libres" class="px-5 py-2 bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 rounded-md font-semibold text-[13px] shadow-sm transition-colors">
        Cancelar
      </button>
      <button type="submit" [disabled]="isSubmitting" class="px-6 py-2 bg-indigo-600 text-white hover:bg-indigo-700 rounded-md font-semibold text-[13px] shadow-sm transition-colors flex items-center disabled:opacity-70 disabled:cursor-not-allowed">
        <svg *ngIf="isSubmitting" class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        Registrar Matrícula Completa
      </button>
    </div>
  </form>
</div>
