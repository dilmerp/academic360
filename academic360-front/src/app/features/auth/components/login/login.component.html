<div class="min-h-screen w-full flex items-center justify-center relative overflow-hidden animate-fade-in">

  <!-- Imagen de fondo pura -->
  <img src="/images/academic-campus-bg.jpg"
       alt="Campus Universitario"
       class="absolute inset-0 w-full h-full object-cover z-0" />

  <!-- Tarjeta Contenedora Híbrida -->
  <div class="relative z-10 w-full max-w-[420px] mx-4 bg-white rounded-2xl shadow-2xl overflow-hidden transition-all duration-300">

    <!-- MITAD SUPERIOR: Oscura Institucional (Academic.360) -->
    <div class="bg-slate-900 px-8 py-8 text-center border-b border-slate-800">
      <div class="inline-flex items-center justify-center w-12 h-12 bg-indigo-600/15 border border-indigo-500/20 rounded-xl mb-3 text-indigo-400">
        <!-- Icono de Candado -->
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
        </svg>
      </div>
      <h2 class="text-2xl font-bold text-white tracking-tight">
        Academic<span class="text-blue-500 font-extrabold">.360</span>
      </h2>
      <p class="text-[12px] text-slate-400 mt-1.5 font-medium">Inicia sesión en tu cuenta para continuar</p>
    </div>

    <!-- MITAD INFERIOR: Blanca y Estilizada -->
    <div class="px-8 py-8">

      <!-- Alertas de Error/Éxito -->
      <div *ngIf="errorMessage()" class="mb-5 px-4 py-2.5 bg-rose-50 border border-rose-200 rounded-lg text-rose-600 text-[12px] font-semibold flex items-center animate-fade-in">
        <svg class="w-4 h-4 mr-2 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        {{ errorMessage() }}
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">

        <!-- Input: Correo electrónico / Usuario -->
        <div>
          <div class="relative">
            <!-- Icono Usuario (Izquierda) -->
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            </div>
            <input type="text" formControlName="usuario"
                   class="w-full bg-white border border-slate-300 rounded-lg text-slate-700 pl-11 pr-4 py-3.5 text-[14px] focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all placeholder-slate-500"
                   placeholder="Correo electrónico">
          </div>
        </div>

        <!-- Input: Contraseña -->
        <div>
          <div class="relative">
            <!-- Icono Candado (Izquierda) -->
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </div>
            <input type="password" formControlName="contrasena"
                   class="w-full bg-white border border-slate-300 rounded-lg text-slate-700 pl-11 pr-12 py-3.5 text-[14px] focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all placeholder-slate-500"
                   placeholder="Contraseña">
            <!-- Icono Ojo (Derecha) -->
            <button type="button" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-slate-600 transition-colors">
              <svg class="w-5 h-5 bg-slate-100 p-1 rounded-full" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
            </button>
          </div>

          <!-- Enlace: Olvidé mi contraseña -->
          <div class="flex justify-end mt-2.5">
            <a href="#" class="text-[13px] font-medium text-slate-500 hover:text-slate-800 transition-colors underline decoration-slate-400 underline-offset-4">Olvidé mi contraseña</a>
          </div>
        </div>

        <!-- Botón Principal: Ingresar (Actualizado a blue-500) -->
        <div class="pt-3">
          <button type="submit" [disabled]="isLoading()"
                  class="w-full flex items-center justify-center gap-2 bg-blue-500 hover:bg-blue-600 active:bg-blue-700 text-white py-3.5 rounded-lg font-extrabold text-[15px] italic tracking-wider transition-all shadow-md disabled:opacity-50 disabled:cursor-not-allowed">
            <svg *ngIf="isLoading()" class="animate-spin h-4 w-4 text-white not-italic" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            {{ isLoading() ? 'INGRESANDO...' : 'INGRESAR' }}
          </button>
        </div>

        <!-- Separador de secciones -->
        <div class="relative flex items-center py-2.5">
          <div class="flex-grow border-t border-slate-200"></div>
          <span class="flex-shrink-0 mx-4 text-slate-500 font-medium text-[13px]">No tengo una cuenta</span>
          <div class="flex-grow border-t border-slate-200"></div>
        </div>

        <!-- Botón Secundario: Registro -->
        <div>
          <button type="button"
                  class="w-full bg-slate-900 hover:bg-slate-800 active:bg-black text-white py-3.5 rounded-lg font-extrabold text-[15px] italic tracking-wider transition-all shadow-md">
            QUIERO REGISTRARME
          </button>
        </div>

      </form>
    </div>
  </div>

  <!-- Botones de Utilidades (Esquina inferior derecha) -->
  <div class="absolute bottom-4 right-4 flex space-x-2 z-10">
    <button class="w-8 h-8 rounded-full bg-slate-900/60 backdrop-blur-md border border-white/10 flex items-center justify-center text-slate-300 hover:text-white transition-colors shadow-lg">
      <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
        <path d="M20.317 4.37a19.791 19.791 0 00-4.885-1.515.074.074 0 00-.079.03c-.21.375-.444.864-.608 1.25a18.27 18.27 0 00-5.487 0 12.64 12.64 0 00-.617-1.25.077.077 0 00-.079-.03A19.736 19.736 0 003.68 4.37a.07.07 0 00-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 00.031.057 19.9 19.9 0 005.993 3.03.078.078 0 00.084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.094 13.094 0 01-1.873-.894.077.077 0 01-.008-.128c.126-.093.252-.19.372-.287a.075.075 0 01.077-.011c3.92 1.793 8.18 1.793 12.061 0a.073.073 0 01.078.009c.12.099.246.195.373.289a.077.077 0 01-.006.127 12.299 12.299 0 01-1.873.894.077.077 0 00-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 00.084.028 19.839 19.839 0 006.002-3.03.077.077 0 00.032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 00-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.156-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.156 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.156-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.156 2.418z"></path>
      </svg>
    </button>
    <button class="w-8 h-8 rounded-full bg-slate-900/60 backdrop-blur-md border border-white/10 flex items-center justify-center text-slate-300 hover:text-white font-bold text-[11px] shadow-lg">?</button>
  </div>
</div>
