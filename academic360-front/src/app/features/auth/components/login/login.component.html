<div class="min-h-screen w-full flex items-center justify-center relative overflow-hidden animate-fade-in">

  <!-- 1. Imagen de fondo pura, sin filtros oscuros -->
  <img src="/images/academic-campus-bg.jpg"
       alt="Campus Universitario"
       class="absolute inset-0 w-full h-full object-cover z-0" />

  <!-- 2. Tarjeta de Login (Z-index 10 para superponerse directamente sobre la imagen brillante) -->
  <div class="relative z-10 w-full max-w-md mx-4 bg-slate-900/70 backdrop-blur-xl border border-white/10 rounded-2xl shadow-2xl overflow-hidden p-8 sm:p-10 transition-all duration-300">

    <!-- Encabezado de la tarjeta -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-12 h-12 bg-indigo-600/15 border border-indigo-500/20 rounded-xl mb-4 text-indigo-400">
        <!-- Icono de Candado -->
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
        </svg>
      </div>
      <h2 class="text-2xl font-bold text-white tracking-tight">
        Academic<span class="text-blue-500 font-extrabold">.360</span>
      </h2>
      <p class="text-xs text-slate-300/80 mt-1.5 font-medium">Inicia sesión en tu cuenta para continuar</p>
    </div>

    <!-- Alertas de Error/Éxito -->
    <div *ngIf="errorMessage()" class="mb-5 px-4 py-2.5 bg-rose-500/10 border border-rose-500/20 rounded-xl text-rose-300 text-xs font-semibold flex items-center animate-fade-in">
      <svg class="w-4 h-4 mr-2 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
      {{ errorMessage() }}
    </div>

    <!-- Formulario -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
      <div>
        <label class="block mb-1.5 text-xs font-semibold text-slate-300">Usuario</label>
        <div class="relative">
          <input type="text" formControlName="usuario"
                 class="w-full bg-slate-950/50 border border-white/10 rounded-xl text-white px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all placeholder-slate-500"
                 placeholder="ej. dpalomino360">
        </div>
      </div>

      <div>
        <div class="flex justify-between items-center mb-1.5">
          <label class="text-xs font-semibold text-slate-300">Contraseña</label>
          <a href="#" class="text-[11px] font-semibold text-indigo-400 hover:text-indigo-300 transition-colors">¿Olvidaste tu contraseña?</a>
        </div>
        <div class="relative">
          <input type="password" formControlName="contrasena"
                 class="w-full bg-slate-950/50 border border-white/10 rounded-xl text-white px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all placeholder-slate-600"
                 placeholder="••••••••">
        </div>
      </div>

      <div class="pt-2">
        <button type="submit" [disabled]="isLoading()"
                class="w-full flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white py-3 rounded-xl font-bold text-sm shadow-lg shadow-indigo-600/10 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
          <svg *ngIf="isLoading()" class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          {{ isLoading() ? 'Iniciando sesión...' : 'Ingresar' }}
        </button>
      </div>
    </form>
  </div>

  <!-- Botones de Utilidades (Esquina inferior derecha) -->
  <div class="absolute bottom-4 right-4 flex space-x-2 z-10">
    <button class="w-8 h-8 rounded-full bg-slate-900/60 backdrop-blur-md border border-white/5 flex items-center justify-center text-slate-400 hover:text-white transition-colors">
      <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
        <path d="M20.317 4.37a19.791 19.791 0 00-4.885-1.515.074.074 0 00-.079.03c-.21.375-.444.864-.608 1.25a18.27 18.27 0 00-5.487 0 12.64 12.64 0 00-.617-1.25.077.077 0 00-.079-.03A19.736 19.736 0 003.68 4.37a.07.07 0 00-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 00.031.057 19.9 19.9 0 005.993 3.03.078.078 0 00.084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.094 13.094 0 01-1.873-.894.077.077 0 01-.008-.128c.126-.093.252-.19.372-.287a.075.075 0 01.077-.011c3.92 1.793 8.18 1.793 12.061 0a.073.073 0 01.078.009c.12.099.246.195.373.289a.077.077 0 01-.006.127 12.299 12.299 0 01-1.873.894.077.077 0 00-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 00.084.028 19.839 19.839 0 006.002-3.03.077.077 0 00.032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 00-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.156-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.156 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.156-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.156 2.418z"></path>
      </svg>
    </button>
    <button class="w-8 h-8 rounded-full bg-slate-900/60 backdrop-blur-md border border-white/5 flex items-center justify-center text-slate-400 hover:text-white font-bold text-xs">?</button>
  </div>
</div>
