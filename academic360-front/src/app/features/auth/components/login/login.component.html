<div class="min-h-screen bg-slate-950 flex justify-center items-center font-sans text-slate-200 p-4">
  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-xl shadow-2xl overflow-hidden">

    <div class="px-8 py-8 border-b border-slate-800 bg-slate-900/80 text-center">
      <div class="mx-auto w-12 h-12 bg-blue-500/20 text-blue-500 rounded-lg flex items-center justify-center mb-4 border border-blue-500/30">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8V7a4 4 0 00-8 0v4h8z"></path></svg>
      </div>
      <h2 class="text-2xl font-bold text-white tracking-tight">Academic.360</h2>
      <p class="text-sm text-slate-400 mt-2">Inicia sesión en tu cuenta para continuar</p>
    </div>

    <div *ngIf="errorMessage()" class="mx-8 mt-6 px-4 py-3 bg-red-900/30 border border-red-500/30 rounded-lg text-red-200 text-sm flex items-center">
      <svg class="w-5 h-5 mr-2 text-red-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      {{ errorMessage() }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="px-8 py-8 bg-slate-800/30">

      <div class="mb-5">
        <label class="block mb-2 text-sm font-medium text-slate-300">Usuario</label>
        <input type="text" formControlName="usuario" class="w-full bg-slate-900 border border-slate-700 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none transition-colors shadow-inner" placeholder="ej. dpalomino360">
        <div *ngIf="loginForm.get('usuario')?.touched && loginForm.get('usuario')?.invalid" class="text-red-400 text-xs mt-1 font-medium">El usuario es requerido.</div>
      </div>

      <div class="mb-8">
        <label class="block mb-2 text-sm font-medium text-slate-300">Contraseña</label>
        <input type="password" formControlName="contrasena" class="w-full bg-slate-900 border border-slate-700 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none transition-colors shadow-inner" placeholder="••••••••">
        <div *ngIf="loginForm.get('contrasena')?.touched && loginForm.get('contrasena')?.invalid" class="text-red-400 text-xs mt-1 font-medium">La contraseña es requerida.</div>
      </div>

      <button type="submit" [disabled]="isSubmitting()" class="w-full flex justify-center items-center gap-2 bg-blue-600 hover:bg-blue-500 text-white px-6 py-2.5 rounded-lg font-medium shadow-lg shadow-blue-500/20 disabled:opacity-50 disabled:shadow-none transition-all">
        <svg *ngIf="isSubmitting()" class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        {{ isSubmitting() ? 'Autenticando...' : 'Ingresar' }}
      </button>

    </form>
  </div>
</div>
