<div class="min-h-screen bg-slate-950 p-6 md:p-12 flex justify-center items-start font-sans text-slate-200">

  <div class="w-full max-w-5xl bg-slate-900 border border-slate-800 rounded-xl shadow-2xl overflow-hidden">

    <!-- Encabezado de la Tarjeta -->
    <div class="px-8 py-6 border-b border-slate-800 flex justify-between items-center bg-slate-900/80">
      <div>
        <h2 class="text-2xl font-bold text-white tracking-tight">Registro de Alumno</h2>
        <p class="text-sm text-slate-400 mt-1">Ingrese los datos para matricular al nuevo estudiante en el ERP.</p>
      </div>
      <div class="hidden sm:block">
        <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-blue-500/10 text-blue-400 border border-blue-500/20">
          Módulo Piloto
        </span>
      </div>
    </div>

    <!-- Alertas Generales -->
    <div *ngIf="errorMessage()" class="mx-8 mt-6 px-4 py-3 bg-red-900/30 border border-red-500/30 rounded-lg text-red-200 text-sm">
      <div class="flex items-center">
        <svg class="w-5 h-5 mr-2 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        {{ errorMessage() }}
      </div>
      <div *ngIf="requiresHomologoConfirmation()" class="mt-3 ml-7 flex gap-3">
        <button type="button" (click)="confirmarHomologo()" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white text-xs font-semibold rounded shadow-sm transition-colors">Sí, guardar homónimo</button>
        <button type="button" (click)="cancelarHomologo()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-600 text-xs font-semibold rounded shadow-sm transition-colors">Cancelar</button>
      </div>
    </div>

    <div *ngIf="successMessage()" class="mx-8 mt-6 px-4 py-3 bg-emerald-900/30 border border-emerald-500/30 rounded-lg text-emerald-200 text-sm flex items-center">
      <svg class="w-5 h-5 mr-2 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      {{ successMessage() }}
    </div>

    <!-- Navegación de Pestañas (Tabs) -->
    <div class="flex flex-wrap border-b border-slate-800 bg-slate-900/50 px-8 pt-4 gap-2">
      <button type="button" (click)="setTab(1)" [ngClass]="{'border-blue-500 text-white bg-slate-800': activeTab() === 1, 'border-transparent text-slate-400 hover:text-slate-200 hover:border-slate-700': activeTab() !== 1}" class="px-4 py-3 border-b-2 text-sm font-medium transition-all rounded-t-lg">
        1. Datos Personales
      </button>
      <button type="button" (click)="setTab(2)" [ngClass]="{'border-blue-500 text-white bg-slate-800': activeTab() === 2, 'border-transparent text-slate-400 hover:text-slate-200 hover:border-slate-700': activeTab() !== 2}" class="px-4 py-3 border-b-2 text-sm font-medium transition-all rounded-t-lg">
        2. Contacto
      </button>
      <button type="button" (click)="setTab(3)" [ngClass]="{'border-blue-500 text-white bg-slate-800': activeTab() === 3, 'border-transparent text-slate-400 hover:text-slate-200 hover:border-slate-700': activeTab() !== 3}" class="px-4 py-3 border-b-2 text-sm font-medium transition-all rounded-t-lg">
        3. Identificación
      </button>
      <button type="button" (click)="setTab(4)" [ngClass]="{'border-blue-500 text-white bg-slate-800': activeTab() === 4, 'border-transparent text-slate-400 hover:text-slate-200 hover:border-slate-700': activeTab() !== 4}" class="px-4 py-3 border-b-2 text-sm font-medium transition-all rounded-t-lg">
        4. Credenciales
      </button>
    </div>

    <!-- Formulario Principal -->
    <form [formGroup]="alumnoForm" (ngSubmit)="onSubmit()" class="px-8 py-8 bg-slate-800/30">

      <!-- PESTAÑA 1: DATOS PERSONALES -->
      <div *ngIf="activeTab() === 1" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block mb-2 text-sm font-medium text-slate-300">Nombres <span class="text-blue-500">*</span></label>
          <input type="text" formControlName="nombres" class="w-full bg-slate-900 border border-slate-700 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none transition-colors shadow-inner" placeholder="Ej. Juan Carlos">
        </div>
        <div>
          <label class="block mb-2 text-sm font-medium text-slate-300">Apellido Paterno <span class="text-blue-500">*</span></label>
          <input type="text" formControlName="paterno" class="w-full bg-slate-900 border border-slate-700 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none transition-colors shadow-inner">
        </div>
        <div>
          <label class="block mb-2 text-sm font-medium text-slate-300">Apellido Materno</label>
          <input type="text" formControlName="materno" class="w-full bg-slate-900 border border-slate-700 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none transition-colors shadow-inner">
        </div>
        <div>
          <label class="block mb-2 text-sm font-medium text-slate-300">Fecha de Nacimiento <span class="text-blue-500">*</span></label>
          <input type="date" formControlName="fechaNacimiento" class="w-full bg-slate-900 border border-slate-700 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none transition-colors shadow-inner [color-scheme:dark]">
        </div>
        <div>
          <label class="block mb-2 text-sm font-medium text-slate-300">Género <span class="text-blue-500">*</span></label>
          <select formControlName="sexo" class="w-full bg-slate-900 border border-slate-700 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none transition-colors shadow-inner appearance-none">
            <option [ngValue]="true">Masculino</option>
            <option [ngValue]="false">Femenino</option>
          </select>
        </div>
        <div>
          <label class="block mb-2 text-sm font-medium text-slate-300">Estado Civil <span class="text-blue-500">*</span></label>
          <select formControlName="idCivil" class="w-full bg-slate-900 border border-slate-700 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none transition-colors shadow-inner appearance-none">
            <option [ngValue]="0">-- Seleccione --</option>
            <option [ngValue]="1">Soltero(a)</option>
            <option [ngValue]="2">Casado(a)</option>
            <option [ngValue]="3">Viudo(a)</option>
          </select>
        </div>
      </div>

      <!-- PESTAÑA 2: CONTACTO -->
      <div *ngIf="activeTab() === 2" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block mb-2 text-sm font-medium text-slate-300">Email Principal <span class="text-blue-500">*</span></label>
          <input type="email" formControlName="email" class="w-full bg-slate-900 border border-slate-700 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none transition-colors shadow-inner" placeholder="correo@ejemplo.com">
        </div>
        <div>
          <label class="block mb-2 text-sm font-medium text-slate-300">Email Opcional</label>
          <input type="email" formControlName="emailOpcional" class="w-full bg-slate-900 border border-slate-700 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none transition-colors shadow-inner">
        </div>
        <div>
          <label class="block mb-2 text-sm font-medium text-slate-300">Celular</label>
          <input type="text" formControlName="celular" class="w-full bg-slate-900 border border-slate-700 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none transition-colors shadow-inner">
        </div>
        <div>
          <label class="block mb-2 text-sm font-medium text-slate-300">Teléfono Fijo</label>
          <input type="text" formControlName="telefono" class="w-full bg-slate-900 border border-slate-700 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none transition-colors shadow-inner">
        </div>
        <div class="md:col-span-2">
          <label class="block mb-2 text-sm font-medium text-slate-300">Dirección de Residencia <span class="text-blue-500">*</span></label>
          <input type="text" formControlName="direccion" class="w-full bg-slate-900 border border-slate-700 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none transition-colors shadow-inner">
        </div>
      </div>

      <!-- PESTAÑA 3: IDENTIFICACIÓN -->
      <div *ngIf="activeTab() === 3" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block mb-2 text-sm font-medium text-slate-300">Tipo de Documento <span class="text-blue-500">*</span></label>
          <select formControlName="idDocumento" class="w-full bg-slate-900 border border-slate-700 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none transition-colors shadow-inner appearance-none">
            <option [ngValue]="0">-- Seleccione --</option>
            <option [ngValue]="1">DNI</option>
            <option [ngValue]="2">Carnet de Extranjería</option>
            <option [ngValue]="3">Pasaporte</option>
          </select>
        </div>
        <div>
          <label class="block mb-2 text-sm font-medium text-slate-300">Número de Documento <span class="text-blue-500">*</span></label>
          <input type="text" formControlName="numeroDocumento" class="w-full bg-slate-900 border border-slate-700 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none transition-colors shadow-inner">
        </div>
        <div>
          <label class="block mb-2 text-sm font-medium text-slate-300">RUC</label>
          <input type="text" formControlName="ruc" placeholder="11 dígitos" class="w-full bg-slate-900 border border-slate-700 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none transition-colors shadow-inner">
        </div>
        <div>
          <label class="block mb-2 text-sm font-medium text-slate-300">Nacionalidad <span class="text-blue-500">*</span></label>
          <select formControlName="idNacionalidad" class="w-full bg-slate-900 border border-slate-700 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none transition-colors shadow-inner appearance-none">
            <option [ngValue]="166">Peruana</option>
            <option [ngValue]="1">Extranjera</option>
          </select>
        </div>
      </div>

      <!-- PESTAÑA 4: CREDENCIALES -->
      <div *ngIf="activeTab() === 4" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="md:col-span-2">
          <p class="text-sm text-slate-400 mb-4">Estas credenciales permitirán al alumno ingresar al portal académico.</p>
        </div>
        <div>
          <label class="block mb-2 text-sm font-medium text-slate-300">Nombre de Usuario <span class="text-blue-500">*</span></label>
          <input type="text" formControlName="usuario" class="w-full bg-slate-900 border border-slate-700 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none transition-colors shadow-inner">
        </div>
        <div>
          <label class="block mb-2 text-sm font-medium text-slate-300">Contraseña de Acceso <span class="text-blue-500">*</span></label>
          <input type="password" formControlName="contrasena" class="w-full bg-slate-900 border border-slate-700 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none transition-colors shadow-inner">
        </div>

        <!-- Ocultamos campos requeridos por VB6 pero no visibles para el usuario en este tab para que form sea válido -->
        <div class="hidden">
           <input type="number" formControlName="idTenor" [ngModel]="1">
        </div>
      </div>

      <!-- Footer / Acciones -->
      <div class="mt-8 pt-6 border-t border-slate-800 flex justify-between items-center">
        <!-- Navegación Secuencial -->
        <div class="flex space-x-3">
          <button type="button" *ngIf="activeTab() > 1" (click)="previousTab()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 text-sm font-medium rounded-lg transition-colors">
            Anterior
          </button>
          <button type="button" *ngIf="activeTab() < 4" (click)="nextTab()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white border border-slate-700 text-sm font-medium rounded-lg transition-colors">
            Siguiente
          </button>
        </div>

        <!-- Botón Final de Guardado -->
        <div *ngIf="activeTab() === 4">
          <button type="submit" [disabled]="isSubmitting() || requiresHomologoConfirmation()" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-500 text-white px-6 py-2.5 rounded-lg font-medium shadow-lg shadow-blue-500/20 disabled:opacity-50 disabled:shadow-none transition-all">
            <svg *ngIf="isSubmitting()" class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            {{ isSubmitting() ? 'Procesando...' : 'Finalizar Registro' }}
          </button>
        </div>
      </div>

    </form>
  </div>
</div>
